spring:
  application:
    name: film-rental

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  thymeleaf:
    cache: false

jwt:
  secret: filmrentalSecretKey1234567890abcdefghijklmnopqrstuvwxyz
  expiration: 86400000

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
